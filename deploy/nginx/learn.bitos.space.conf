server {
    server_name learn.bitos.space;

    root /var/www/learn.bitos.space;
    index index.html;

    # Deployed files keep stable URLs. Store responses and revalidate with
    # ETag/Last-Modified before reuse, including images and fonts.
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /sw.js {
        # A location with add_header does not inherit server-level add_header
        # directives on this Nginx version.
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /vendor/precache.json {
        try_files $uri =404;
    }

    location ~* \.(?:html|css|js|json|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/learn.bitos.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.bitos.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.bitos.space;
    return 301 https://$host$request_uri;
}
