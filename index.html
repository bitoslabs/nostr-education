    <script type="importmap">
      {
        "imports": {
          "vanjs-core": "./vendor/vanjs-core/van.js",
          "nostr-tools/pure": "./vendor/nostr-tools/pure.js",
          "nostr-tools/nip19": "./vendor/nostr-tools/nip19.js",
          "nostr-tools/nip44": "./vendor/nostr-tools/nip44.js",
          "nostr-tools/nip46": "./vendor/nostr-tools/nip46.js",
          "nostr-tools/pool": "./vendor/nostr-tools/pool.js",
          "qrcode-generator": "./vendor/qrcode-generator/qrcode.js",
          "@noble/curves/": "./vendor/@noble/curves/",
          "@noble/hashes/": "./vendor/@noble/hashes/",
          "@noble/ciphers/": "./vendor/@noble/ciphers/",
          "@scure/base": "./vendor/@scure/base/index.js"
        }
      }
    </script>
    <script>
      window.addEventListener('error', function (event) {
        var box = document.getElementById('jserr');
        if (!box) {
          box = document.createElement('div');
          box.id = 'jserr';
          box.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:9999;font:11px monospace;color:#ff8080;background:rgba(0,0,0,.9);padding:6px;white-space:pre-wrap;';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent +=
          (box.textContent ? ' | ' : '') +
          event.message +
          ' @' +
          (event.filename || '').split('/').pop() +
          ':' +
          event.lineno;
      });
    </script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="common.skipToContent">Skip to content</a>
    <div id="app" data-app-root></div>
    <div id="overlays" data-overlay-root></div>
    <script type="module" src="./src/main.js"></script>
    <script>
      // Offline shell: cache the app after the first online visit (see sw.js).
      // updateViaCache:'none' keeps the worker script itself out of the browser
      // HTTP cache so a new build is picked up on the next load.
      if ('serviceWorker' in navigator) {
        var hadController = !!navigator.serviceWorker.controller;
        var reloaded = false;
        // When a new worker takes over, reload once so the page runs the new
        // build instead of the modules the old worker cached.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloaded) return;
          reloaded = true;
          location.reload();
        });
        window.addEventListener('load', function () {
          fetch('./vendor/precache.json', { cache: 'no-store' })
            .then(function (response) {
              if (!response.ok) throw new Error('Could not load app version');
              return response.json();
            })
            .then(function (manifest) {
              if (!manifest.version) throw new Error('App version is missing');
              return navigator.serviceWorker.register(
                './sw.js?v=' + encodeURIComponent(manifest.version),
                { updateViaCache: 'none' },
              );
            })
            .catch(function () {
              // No manifest (for example, offline during the first boot):
              // register directly so offline mode can still be installed.
              return navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
            })
            .then(function (registration) {
              return registration.update();
            })
            .catch(function () {
              /* offline mode unavailable; the app still runs online */
            });
        });
      }
    </script>
  </body>
</html>
